[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "digital-authenticity-analyst"
version = "0.1.0"
description = "Digital Forensics & AI Detection Analyst — multi-modal authenticity checking pipeline"
requires-python = ">=3.11"
dependencies = [
    # API / web
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # Media & file forensics
    "Pillow>=10.3.0",
    "opencv-python-headless>=4.9.0.80",
    "exifread>=3.0.0",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "filetype>=1.2.0",
    # PDF forensics
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pyhanko>=0.21.0",
    # Audio forensics
    "librosa>=0.10.2",
    "mutagen>=1.47.0",
    "resemblyzer>=0.1.1.dev0",
    "soundfile>=0.12.1",
    # OSINT / network
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-whois>=0.9.4",
    # LLM / AI
    "google-generativeai>=0.7.0",
    "anthropic>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Utilities
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.1",
    "structlog>=24.2.0",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
